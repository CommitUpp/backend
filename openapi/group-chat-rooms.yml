get:
  summary: グループのチャットルーム一覧取得API
  operationId: getGroupChatRooms
  security:
    - SupabaseAuth: []
  parameters:
    - name: group_id
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: グループのチャットルーム一覧取得成功
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GetGroupChatRoomsResponse'
    '400':
      description: バリデーションエラー
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BadRequestError'
    '401':
      description: 認証エラー
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnauthorizedError'
    '403':
      description: 権限エラー
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ForbiddenError'
    '500':
      description: サーバー内部エラー
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalServerError'
