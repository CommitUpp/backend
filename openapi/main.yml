openapi: 3.0.3
info:
  title: CommitUpp API
  version: 1.0.0

servers:
  - url: /api/v1

paths:
  /groups:
    $ref: './groups.yml'
  /groups/{group_id}/join:
    $ref: './group-join.yml'
  /user/callback:
    $ref: './user-login-callback.yml'
  /user/logout:
    $ref: './user-logout.yml'
  /user/favorite-movies:
    $ref: './my-favorite-movies.yml'
  /user/{user_id}/favorite-movies:
    $ref: './user-favorite-movies.yml'
  /movies:
    $ref: './movies.yml'
  /movies/{movie_id}:
    $ref: './movie-detail.yml'
  /user/movie/status:
    $ref: './user-movie-status.yml'
  /groups/{group_id}/watched-movies:
    $ref: './group-watched-movies.yml'
  /groups/{group_id}/chat-rooms:
    $ref: './group-chat-rooms.yml'
  /chat-rooms/{room_id}/messages:
    $ref: './chat-messages.yml'

components:
  securitySchemes:
    SupabaseAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    CreateGroupRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50

    CreateGroupResponse:
      type: object
      required:
        - group
      properties:
        group:
          $ref: "#/components/schemas/Group"

    GetMyGroupsResponse:
      type: object
      required:
        - groups
      properties:
        groups:
          type: array
          items:
            $ref: '#/components/schemas/MyGroup'

    JoinGroupResponse:
      type: object
      required:
        - group
      properties:
        group:
          $ref: '#/components/schemas/Group'

    Group:
      type: object
      required:
        - id
        - name
        - monthlyGoal
        - createdAt
      properties:
        id:
          type: string
        name:
          type: string
        monthlyGoal:
          type: integer
          format: int32
          minimum: 0
        createdAt:
          type: string
          format: date-time

    MyGroup:
      type: object
      required:
        - id
        - name
        - memberCount
      properties:
        id:
          type: string
        name:
          type: string
        memberCount:
          type: integer
          format: int32
          minimum: 0

    LoginCallbackResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string

    LogoutResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string

    MoviesResponse:
      type: object
      required:
        - movies
      properties:
        movies:
          type: array
          items:
            $ref: '#/components/schemas/Movie'

    Movie:
      type: object
      required:
        - movie_id
        - tmdb_id
        - title
        - genres
        - trailer_url
      properties:
        movie_id:
          type: string
        tmdb_id:
          type: string
        title:
          type: string
        genres:
          type: array
          items:
            type: string
        trailer_url:
          type: string

    MovieDetail:
      type: object
      required:
        - movie_id
        - tmdb_id
        - title
        - genres
        - poster_url
        - trailer_url
        - overview
        - release_date
        - watched_user
      properties:
        movie_id:
          type: string
          format: uuid
        tmdb_id:
          type: string
        title:
          type: string
        genres:
          type: array
          items:
            type: string
        poster_url:
          type: string
        trailer_url:
          type: string
        overview:
          type: string
        release_date:
          type: string
        streaming_services:
          type: array
          items:
            type: string
        watched_user:
          type: array
          items:
            type: string

    UserMovieStatusRequest:
      type: object
      required:
        - movie_id
        - status
      properties:
        movie_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [watched, wanna_watch]

    UserMovieStatusResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: success

    GetUserMovieStatus:
      type: object
      required:
        - movie_id
        - tmdb_id
        - title
        - poster_url
        - trailer_url
        - overview
        - release_date
        - updated_at
      properties:
        movie_id:
          type: string
        tmdb_id:
          type: string
        title:
          type: string
        poster_url:
          type: string
        trailer_url:
          type: string
        overview:
          type: string
        release_date:
          type: string
        updated_at:
          type: string
          format: date-time

    GetUserMovieStatusResponse:
      type: object
      required:
        - movies
      properties:
        movies:
          type: array
          items:
            $ref: "#/components/schemas/GetUserMovieStatus"

    GetFavoriteMoviesResponse:
      type: object
      required:
        - movies
      properties:
        movies:
          type: array
          items:
            $ref: "#/components/schemas/Movie"

    FavoriteMoviesRequest:
      type: object
      required:
        - movie_ids
      properties:
        movie_ids:
          type: array
          maxItems: 3
          uniqueItems: true
          items:
            type: string
            format: uuid

    FavoriteMoviesResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: success

    GetGroupWatchedMoviesResponse:
      type: object
      required:
        - group_id
        - movies
      properties:
        group_id:
          type: string
        movies:
          type: array
          items:
            $ref: "#/components/schemas/GetGroupWatchedMoviesMovie"

    GetGroupWatchedMoviesMovie:
      type: object
      required:
        - movie_id
        - title
        - trailer_url
        - watched_member
      properties:
        movie_id:
          type: string
        title:
          type: string
        trailer_url:
          type: string
        watched_member:
          type: array
          items:
            $ref: "#/components/schemas/WatchedMember"

    WatchedMember:
      type: object
      required:
        - user_id
        - avatar_url
      properties:
        user_id:
          type: string
        avatar_url:
          type: string

    GetGroupChatRoomsResponse:
      type: object
      required:
        - chat_rooms
      properties:
        chat_rooms:
          type: array
          items:
            $ref: "#/components/schemas/ChatRoom"

    CreateChatRoomRequest:
      type: object
      required:
        - movie_id
      properties:
        movie_id:
          type: string
          format: uuid

    CreateChatRoomResponse:
      type: object
      required:
        - chat_room
      properties:
        chat_room:
          $ref: "#/components/schemas/ChatRoom"

    ChatRoom:
      type: object
      required:
        - id
        - group_id
        - movie_id
        - movie_title
        - created_by
        - created_at
      properties:
        id:
          type: string
          format: uuid
        group_id:
          type: string
          format: uuid
        movie_id:
          type: string
          format: uuid
          nullable: true
        movie_title:
          type: string
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time

    CreateChatMessageRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 1000

    CreateChatMessageResponse:
      type: object
      required:
        - message
      properties:
        message:
          $ref: "#/components/schemas/ChatMessage"

    ChatMessage:
      type: object
      required:
        - id
        - room_id
        - user_id
        - content
        - created_at
      properties:
        id:
          type: string
          format: uuid
        room_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        content:
          type: string
        created_at:
          type: string
          format: date-time

    BadRequestError:
      type: object
      required:
        - message
      properties:
        message:
          type: string

    ForbiddenError:
      type: object
      required:
        - message
      properties:
        message:
          type: string  

    UnauthorizedError:
      type: object
      required:
        - message
      properties:
        message:
          type: string

    NotFoundError:
      type: object
      required:
        - message
      properties:
        message:
          type: string

    ConflictError:
      type: object
      required:
        - message
      properties:
        message:
          type: string

    InternalServerError:
      type: object
      required:
        - message
      properties:
        message:
          type: string
